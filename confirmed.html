<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Email Confirmed</title>

    <style>

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family:
                Arial,
                sans-serif;

            background: #f0fdf4;
            color: #14532d;
        }


        .confirmation-card {

            background: white;

            width: 90%;
            max-width: 450px;

            padding: 40px 30px;

            border-radius: 16px;

            text-align: center;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.08);
        }


        .icon {

            font-size: 55px;

            margin-bottom: 15px;
        }


        h1 {

            margin-bottom: 10px;

            color: #15803d;
        }


        p {

            color: #555;

            line-height: 1.6;

            margin-bottom: 25px;
        }


        .login-button {

            display: inline-block;

            padding: 12px 24px;

            background: #16a34a;

            color: white;

            text-decoration: none;

            border-radius: 8px;

            font-weight: 600;
        }


        .login-button:hover {

            background: #15803d;
        }

    </style>
</head>

<body>

    <div class="confirmation-card">

        <div class="icon">
            ✅
        </div>

        <h1>
            Email Confirmed!
        </h1>

        <p>
            Your email has been successfully confirmed.
            You can now log in to your GS QCAB account.
        </p>

        <a
            href="index.html"
            class="login-button"
        >
            Go to Login
        </a>

    </div>

</body>
</html>
